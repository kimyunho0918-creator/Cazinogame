<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Luxury Slot Machine</title>
  <style>
    :root {
      --bg-dark: #030303;
      --bg-light: #1c1a16;
      --machine-bg: linear-gradient(145deg, #1a1815 0%, #0a0a0a 100%);
      --gold-light: #fdf0a6;
      --gold: #d4af37;
      --gold-dark: #8b6914;
      --gold-grad: linear-gradient(180deg, #fdf0a6 0%, #d4af37 45%, #997a00 100%);
      --gold-border: linear-gradient(145deg, #d4af37, #554400);
      --text: #ffffff;
      --reel-size: 120px;
    }

    body {
      font-family: 'Georgia', 'Segoe UI', serif;
      background: radial-gradient(circle at 50% 30%, #1c1a16 0%, #030303 80%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      overflow: hidden;
    }

    /* 화면 컨테이너 */
    .screen { display: none; }
    .screen.active { display: block; }

    /* 공통 패널 스타일 (초기화면 & 종료화면) */
    .menu-panel {
      background: var(--machine-bg); padding: 45px; border-radius: 16px;
      text-align: center; width: 420px; position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 1px 1px rgba(255,255,255,0.1);
      margin: 0 auto;
    }
    .menu-panel::before {
      content: ""; position: absolute; inset: -3px; border-radius: 19px;
      background: var(--gold-grad); z-index: -1;
    }
    .menu-panel h1 { 
      margin-bottom: 10px; font-weight: 900; font-size: 36px; letter-spacing: 3px;
      background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }
    .menu-panel p { color: #888; font-family: sans-serif; font-size: 14px; margin-bottom: 30px; }
    
    input[type="number"] {
      width: 80%; padding: 14px; font-size: 24px; text-align: center; margin-bottom: 25px;
      border-radius: 6px; border: 1px solid var(--gold-dark);
      background-color: #050505; color: var(--gold-light); outline: none; font-family: monospace;
    }

    button.gold-btn {
      background: var(--gold-grad); color: #111; border: none; padding: 16px 30px;
      font-size: 20px; font-weight: 900; border-radius: 6px; cursor: pointer; width: 100%;
      letter-spacing: 2px; box-shadow: 0 6px 15px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.4);
      transition: all 0.15s ease;
    }
    button.gold-btn:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    button.gold-btn:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }

    /* 게임 종료 화면 전용 텍스트 */
    #final-balance-display {
      font-size: 40px; color: var(--gold-light); font-family: monospace; margin: 20px 0;
      text-shadow: 0 0 20px rgba(212,175,55,0.4);
    }

    /* 메인 게임 화면 컨테이너 */
    .machine-wrap { display: flex; align-items: flex-end; gap: 20px; }

    /* 🚪 좌측 상단 CASH OUT 버튼 (슬롯머신 테마 적용) */
    #quit-btn {
      background: linear-gradient(180deg, #1f1b13, #0a0805);
      color: var(--gold-light);
      border: 2px solid var(--gold-dark);
      padding: 20px 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 2px 5px rgba(212,175,55,0.2);
      transition: all 0.2s;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      height: fit-content;
      margin-bottom: 35px; /* 본체의 패딩과 하단 라인 맞춤 */
    }
    #quit-btn:hover {
      background: linear-gradient(180deg, #2c2518, #110e08);
      border-color: var(--gold); color: #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 2px 10px rgba(212,175,55,0.4);
      transform: translateY(-2px);
    }
    #quit-btn:disabled {
      background: #111; color: #555; border-color: #333; cursor: not-allowed; 
      box-shadow: none; transform: none;
    }

    /* 슬롯머신 본체 */
    .slot-machine-core {
      background: var(--machine-bg); padding: 35px; border-radius: 20px;
      width: 620px; text-align: center; position: relative;
      box-shadow: 0 30px 60px rgba(0,0,0,0.95), inset 0 1px 2px rgba(255,255,255,0.05);
    }
    .slot-machine-core::before {
      content: ""; position: absolute; inset: -4px; border-radius: 24px;
      background: var(--gold-border); z-index: -1;
    }

    .info-panel { display: flex; justify-content: space-between; margin-bottom: 25px; }
    .info-box {
      background: linear-gradient(180deg, #0a0a0a, #000); padding: 15px; border-radius: 8px;
      border: 1px solid #3a2c00; width: 46%; box-shadow: inset 0 5px 15px rgba(0,0,0,1);
    }
    .info-box div { font-size: 12px; color: #a38a41; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; font-family: sans-serif; }
    .info-box span, .info-box input {
      font-size: 28px; font-weight: bold; color: var(--gold-light); background: transparent; 
      border: none; text-align: center; width: 100%; outline: none; font-family: monospace;
      text-shadow: 0 0 10px rgba(212,175,55,0.2);
    }

    /* 슬롯 릴 디자인 */
    .reel-board {
      background: #080808; padding: 25px; border-radius: 12px; border: 1px solid #222;
      box-shadow: inset 0 10px 30px rgba(0,0,0,1); display: flex; justify-content: space-between; 
      margin-bottom: 25px; position: relative;
    }
    .reel-board::after {
      content: ""; position: absolute; inset: 0; border: 2px solid var(--gold-dark); 
      border-radius: 12px; pointer-events: none; opacity: 0.5;
    }
    .reel-window {
      width: 30%; height: var(--reel-size); overflow: hidden;
      background: linear-gradient(180deg, #cfc9bd, #fdfaf4 20%, #fdfaf4 80%, #cfc9bd); 
      border-radius: 6px; position: relative;
      box-shadow: 0 0 0 3px #111, 0 0 0 5px var(--gold-dark), inset 0 8px 15px rgba(0,0,0,0.5);
    }
    .reel-window::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 30px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); z-index: 2; pointer-events: none;
    }
    .reel-window::after {
      content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 30px;
      background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent); z-index: 2; pointer-events: none;
    }
    .reel-list { list-style: none; margin: 0; padding: 0; }
    .symbol {
      height: var(--reel-size); display: flex; align-items: center; justify-content: center; 
      font-size: 70px; color: #111; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
    }

    #message-board {
      background: #000; padding: 16px; border-radius: 6px; font-size: 16px; font-weight: bold; 
      margin-bottom: 25px; border: 1px solid #332700; color: var(--gold-light); font-family: sans-serif;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); letter-spacing: 0.5px;
    }

    /* 레버 디자인 */
    .handle-box { width: 80px; height: 260px; position: relative; cursor: pointer; }
    .handle-base {
      width: 45px; height: 120px; background: linear-gradient(90deg, #111, #2a2a2a, #050505);
      border-radius: 0 10px 10px 0; position: absolute; left: 0; bottom: 0;
      border: 2px solid #443; border-left: none; box-shadow: 10px 10px 20px rgba(0,0,0,0.8);
    }
    .handle-stick {
      width: 16px; height: 180px; background: linear-gradient(90deg, #554400, var(--gold-light), #4a3800);
      position: absolute; left: 14px; bottom: 100px; border-radius: 999px; transform-origin: bottom center;
      box-shadow: inset -2px 0 5px rgba(0,0,0,0.5);
    }
    .handle-knob {
      width: 60px; height: 60px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 25%, #4a3600 80%);
      position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
      box-shadow: 5px 15px 20px rgba(0,0,0,0.8);
    }
    .pulling .handle-stick { animation: pullLever 0.5s cubic-bezier(0.25, 0.1, 0.25, 1); }
    @keyframes pullLever {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(35deg); }
      70% { transform: rotate(20deg); }
    }

    /* 🕵️‍♂️ 극비 스텔스 조명 (화면 우측 하단 3px 초소형 원형 점) */
    #stealth-light {
      position: fixed; bottom: 15px; right: 15px; width: 3px; height: 3px;
      border-radius: 50%; background-color: transparent;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      z-index: 9999; pointer-events: none; box-shadow: 0 0 5px transparent;
    }
  </style>
</head>
<body>

  <!-- 스텔스 점 조명 -->
  <div id="stealth-light"></div>

  <!-- 1. 초기 설정 화면 -->
  <div id="entry-screen" class="screen active menu-panel">
    <h1>VIP SLOT</h1>
    <p>품격 있는 귀하를 환영합니다. 시작 포인트를 설정해주십시오.</p>
    <!-- 초기 세팅 1000 PT -->
    <input type="number" id="start-balance" value="1000" min="100" step="100" />
    <button class="gold-btn" onclick="startGame()">ENTER THE ROOM</button>
  </div>

  <!-- 2. 메인 게임 화면 -->
  <div id="game-screen" class="screen">
    <div class="machine-wrap">

      <!-- 좌측 메탈릭 수동 종료 버튼 -->
      <button id="quit-btn" onclick="endGame(true)">
        <span>CASH OUT</span>
        <span style="font-size: 13px; color: #a38a41; font-family: sans-serif;">(정산 및 종료)</span>
      </button>
      
      <div class="slot-machine-core">
        <div class="info-panel">
          <div class="info-box">
            <div>CURRENT BALANCE (PT)</div>
            <span id="balance-display">0</span>
          </div>
          <div class="info-box">
            <div>BET AMOUNT (PT)</div>
            <!-- 기본 베팅 100 PT -->
            <input type="number" id="bet-input" value="100" min="10" step="10" />
          </div>
        </div>

        <div class="reel-board">
          <div class="reel-window"><ul id="reel1" class="reel-list"></ul></div>
          <div class="reel-window"><ul id="reel2" class="reel-list"></ul></div>
          <div class="reel-window"><ul id="reel3" class="reel-list"></ul></div>
        </div>

        <div id="message-board">준비 완료. 행운을 빕니다.</div>
        <button id="spin-btn" class="gold-btn" onclick="spin()">PULL TO SPIN (Space)</button>
      </div>

      <div id="handle-container" class="handle-box" onclick="spin()">
        <div class="handle-base"></div>
        <div class="handle-stick"><div class="handle-knob"></div></div>
      </div>

    </div>
  </div>

  <!-- 3. 게임 종료 화면 -->
  <div id="game-over-screen" class="screen menu-panel">
    <h1 style="color: #ff6b6b;">GAME OVER</h1>
    <p style="color: var(--gold); font-weight: bold;">최종 정산이 완료되었습니다.</p>
    <p style="margin-bottom: 5px;">FINAL BALANCE</p>
    <h2 id="final-balance-display">0</h2>
    <button class="gold-btn" onclick="location.reload()" style="margin-top: 20px;">처음으로 돌아가기</button>
  </div>

  <script>
    const config = { '🍒': 2.0, '🍋': 3.0, '🍇': 5.0, '💎': 10.0, '7️⃣': 15.0 };
    const symbols = Object.keys(config);
    const reelSize = 120;
    
    let balance = 0;
    let isSpinning = false;
    let isGameOver = false;
    let adminMode = null; 
    const reelsDOM = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
    const stealthLight = document.getElementById('stealth-light');

    function setStealthLight(color, shadow) {
      stealthLight.style.backgroundColor = color;
      stealthLight.style.boxShadow = `0 0 5px ${shadow}`;
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    window.addEventListener('keydown', e => {
      if (document.getElementById('game-screen').classList.contains('active') && !isGameOver) {
        const key = e.key.toLowerCase();

        if (key === ' ' || e.code === 'Space') {
          e.preventDefault(); 
          if (!isSpinning) spin();
        }

        if (key === 'z') { adminMode = 0; setStealthLight('rgba(0, 100, 255, 0.3)', 'rgba(0, 100, 255, 0.2)'); }
        if (key === 'x') { adminMode = 1; setStealthLight('rgba(0, 255, 255, 0.3)', 'rgba(0, 255, 255, 0.2)'); }
        if (key === 'c') { adminMode = 2; setStealthLight('rgba(0, 255, 0, 0.3)', 'rgba(0, 255, 0, 0.2)'); }
        if (key === 'v') { adminMode = 3; setStealthLight('rgba(255, 255, 0, 0.3)', 'rgba(255, 255, 0, 0.2)'); }
        if (key === 'b') { adminMode = 4; setStealthLight('rgba(200, 0, 255, 0.3)', 'rgba(200, 0, 255, 0.2)'); }
        if (key === 'n') { adminMode = 'lose'; setStealthLight('rgba(255, 0, 0, 0.3)', 'rgba(255, 0, 0, 0.2)'); }
        if (key === 'm') { adminMode = null; setStealthLight('transparent', 'transparent'); }
      }
    });

    function startGame() {
      balance = parseInt(document.getElementById('start-balance').value) || 1000;
      isGameOver = false;
      showScreen('game-screen');
      buildReels();
      updateUI();
    }

    function buildReels() {
      reelsDOM.forEach(reel => {
        let html = '';
        for (let i = 0; i < 15; i++) {
          symbols.forEach(s => html += `<li class="symbol">${s}</li>`);
        }
        reel.innerHTML = html;
        reel.style.transform = 'translateY(0px)';
      });
    }

    function updateUI() {
      // 숫자 뒤에 단위를 붙이지 않고 패널 제목에 표시함 (또는 포맷 자체에 적용)
      document.getElementById('balance-display').innerText = balance.toLocaleString();
    }

    function showMessage(text, color = 'var(--gold-light)') {
      const msgBoard = document.getElementById('message-board');
      msgBoard.innerText = text;
      msgBoard.style.color = color;
    }

    // 🎯 커스텀 확률 (꽝 90%)
    function getRandomResultByProbability() {
      const rand = Math.random() * 100; 
      if (rand < 95) return 'lose';               
      else if (rand < 98) return 0;               
      else if (rand < 99.5) return 1;               
      else if (rand < 99.99) return 2;               
      else if (rand < 99.999) return 3;             
      else return 4;                              
    }

    function getForcedLoseArray() {
      const first = Math.floor(Math.random() * symbols.length);
      return [first, (first + 1) % symbols.length, (first + 2) % symbols.length];
    }

    async function spin() {
      if (document.activeElement === document.getElementById('bet-input')) {
        document.getElementById('bet-input').blur();
      }

      const bet = parseInt(document.getElementById('bet-input').value) || 100;

      if (isSpinning || isGameOver) return;
      if (balance < bet || bet <= 0) {
        showMessage('잔액(PT)이 부족합니다.', '#ff6b6b');
        return;
      }

      isSpinning = true;
      balance -= bet;
      updateUI();
      document.getElementById('spin-btn').disabled = true;
      document.getElementById('quit-btn').disabled = true; 
      showMessage('머신이 회전하고 있습니다...', '#ccc');

      const handle = document.getElementById('handle-container');
      handle.classList.add('pulling');
      setTimeout(() => handle.classList.remove('pulling'), 500);

      let results = [];
      if (adminMode === 'lose') {
        results = getForcedLoseArray();
      } else if (adminMode !== null) {
        results = [adminMode, adminMode, adminMode];
      } else {
        const probResult = getRandomResultByProbability();
        if (probResult === 'lose') {
          results = getForcedLoseArray();
        } else {
          results = [probResult, probResult, probResult];
        }
      }

      const promises = reelsDOM.map((reel, i) => new Promise(resolve => {
        reel.style.transition = 'none';
        reel.style.transform = 'translateY(0px)';
        void reel.offsetHeight;

        const move = (reelSize * symbols.length * (5 + i)) + (results[i] * reelSize);
        const duration = 2.5 + i * 0.6;

        reel.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.8, 0.1, 1)`;
        reel.style.transform = `translateY(-${move}px)`;

        setTimeout(resolve, duration * 1000);
      }));

      await Promise.all(promises);
      checkResult(results, bet);
    }

    function checkResult(results, bet) {
      if (results[0] === results[1] && results[1] === results[2]) {
        const symbol = symbols[results[0]];
        const winAmount = Math.floor(bet * config[symbol]);
        balance += winAmount;
        showMessage(`🎉 당첨! +${winAmount.toLocaleString()} PT (${symbol})`, 'var(--gold)');
        updateUI();

        // 당첨 시 2.5초 대기 후 강제 게임 종료 (isManual = false)
        isGameOver = true;
        setTimeout(() => endGame(false), 2500);

      } else {
        showMessage('아쉽습니다. 다음 기회에 도전하십시오.', '#888');
        updateUI();
        isSpinning = false;
        adminMode = null; 
        setStealthLight('transparent', 'transparent');
        document.getElementById('spin-btn').disabled = false;
        document.getElementById('quit-btn').disabled = false;
      }
    }

    // 게임 종료 및 정산 (수동 종료 여부 확인)
    function endGame(isManual = false) {
      if(isSpinning && !isGameOver) return; // 스핀 도중 수동 종료 방지
      isGameOver = true;
      
      let bonusMessage = "";
      if (isManual) {
        balance += 200; // 수동 종료 시 200 PT 보너스 지급
        bonusMessage = "<br><span style='font-size: 18px; color: #7dff9a; display: block; margin-top: 15px; font-family: sans-serif;'>💡 수동 종료 보너스 +200 PT 지급!</span>";
      }

      // 최종 금액 및 보너스 메시지 표시 (단위 PT 적용)
      document.getElementById('final-balance-display').innerHTML = balance.toLocaleString() + ' PT' + bonusMessage;
      showScreen('game-over-screen');
    }
  </script>
</body>
</html>
